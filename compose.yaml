version: '3.8'

services:
    php:
        container_name: php-container
        build:
           context: ./docker/php
        ports:
            - '9000:9000'
        volumes:
            - .:/var/www/project
        depends_on:
            - postgres

    nginx:
        container_name: nginx-container
        build:
            context: ./docker/nginx
        ports:
            - ${NGINX_PORT}:80
        volumes:
            - .:/var/www/project:ro
            - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
        restart: always
        depends_on:
            - php

    postgres:
        container_name: postgres-container
        build:
            context: ./docker/postgres
        environment:
            POSTGRES_DB: db
            POSTGRES_USER: myuser
            POSTGRES_PASSWORD: mypassword
        ports:
            - '5432:5432'
        healthcheck:
            test: ['CMD-SHELL', 'pg_isready -U myuser -d db']
            timeout: 5s
            retries: 5
            start_period: 30s
        volumes:
            - postgres_data:/var/lib/postgresql/data

volumes:
    postgres_data:

networks:
    nginx-php-database:

